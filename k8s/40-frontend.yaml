apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devtools
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # LOCAL-ONLY reference, like the backend. Nothing publishes
          # devtools-frontend:dev, so load it into the cluster's image store
          # before applying:
          #   docker build -f frontend/Dockerfile -t devtools-frontend:dev frontend
          #   kind load docker-image devtools-frontend:dev
          image: devtools-frontend:dev
          imagePullPolicy: IfNotPresent
          # Deliberately narrower than the backend's context. nginx:alpine
          # starts as root to bind :80 and then drops its workers to the
          # nginx user (101:101), so runAsNonRoot would fail to start and
          # dropping ALL capabilities would remove the CHOWN/SETUID/SETGID
          # and NET_BIND_SERVICE it needs to do that. Blocking privilege
          # escalation is the part that applies here.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devtools
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
