apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devtools
  namespace: devtools
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: devtools.local
      http:
        paths:
          # Matches both /api and /api/... . Under the old /(api/.*) a bare
          # /api missed this rule, fell through to the catch-all below, and
          # was served the SPA instead of the API. The inner group is
          # non-capturing so $1 remains the whole path for rewrite-target.
          - path: /(api(?:/.*)?)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
