apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devtools
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Unqualified tag with no registry: this is a LOCAL-ONLY reference,
          # matched by imagePullPolicy: IfNotPresent. Build it into the
          # cluster's own image store before applying, e.g.
          #   docker build -f backend/Dockerfile -t devtools-backend:dev .
          #   kind load docker-image devtools-backend:dev
          # (or `minikube image load`). A real cluster cannot pull this.
          image: devtools-backend:dev
          imagePullPolicy: IfNotPresent
          # Backend runs as appuser 1000:1000 (see backend/Dockerfile) and
          # binds 8000, so it needs no capabilities. runAsUser must be given
          # numerically: kubelet refuses runAsNonRoot when the image's USER is
          # a name it cannot resolve to a uid.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            # Optional on purpose. app/config.py declares no credential
            # settings, so this Secret currently supplies nothing the app
            # reads, and k8s/15-secret.yaml is deliberately not in the repo.
            # Without optional: true the pod would stay stuck in
            # CreateContainerConfigError on a cluster that lacks it.
            - secretRef:
                name: backend-secret
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devtools
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
