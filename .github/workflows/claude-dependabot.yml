name: Claude · Dependabot auto-review

# WHY pull_request_target (and not pull_request):
# Workflows triggered by Dependabot run with a READ-ONLY GITHUB_TOKEN and NO access
# to repository secrets, so a plain `pull_request` run could never read
# CLAUDE_CODE_OAUTH_TOKEN. `pull_request_target` runs in the context of the base
# branch (develop), which has secret access and a writable token. This stays safe
# because the job (a) is gated on the PR author being dependabot[bot] — an actor you
# cannot open a PR as — and (b) only ever checks out Dependabot's own in-repo branch,
# never a fork.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write # Claude pushes fixes; we squash-merge
  pull-requests: write # comment, approve, label, merge
  issues: write # PR/issue housekeeping by the action
  id-token: write # OIDC for anthropics/claude-code-action

concurrency:
  group: claude-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only ever run for Dependabot's own PRs.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Claude reviews the update and fixes any breakage
        # ADVISORY ONLY — must never decide the merge. The next step is the
        # authoritative gate. Without continue-on-error, a reviewer that merely
        # ran long ("reported a successful result after 36 turns, exceeding the
        # configured maximum of 30") failed the job before pytest ever ran,
        # leaving the PR blocked with no test evidence either way.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # pull_request_target runs cannot mint a GitHub App token via the OIDC
          # exchange (it 401s with "Invalid OIDC token"), so pass the workflow's
          # own token directly for GitHub API/commit operations.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # claude-code-action refuses bot-initiated runs by default. This job is
          # already gated to dependabot[bot] PRs (see the job-level `if`), so allow
          # that one bot through explicitly.
          allowed_bots: "dependabot[bot]"
          prompt: |
            A Dependabot pull request updated these dependencies:
              ${{ steps.meta.outputs.dependency-names }}
            Semver update type: ${{ steps.meta.outputs.update-type }}

            Do this, then post ONE PR comment summarising what you found and did:
            1. Check each dependency's changelog / release notes for BREAKING changes
               between the previous and new version.
            2. If the new version breaks this repo (renamed or removed APIs, changed
               signatures, changed behaviour), fix the affected call sites. Keep the
               change minimal and scoped to what the upgrade requires — do not refactor
               unrelated code.
            3. Verify:
                 backend deps  ->  cd backend && uv sync && uv run pytest
                 frontend deps ->  cd frontend && npm ci && npm run lint
            4. Commit any fixes to this branch with a clear message.
            5. Finish the comment with exactly one of these lines on its own:
                 VERDICT: SAFE
                 VERDICT: NEEDS-REVIEW
               Use NEEDS-REVIEW if anything is ambiguous or a human should look.
          # 30 was too low for grouped bumps: a 4-dependency group needs a
          # changelog check plus a verify run per dependency and overran at 36.
          claude_args: "--allowedTools Bash,Edit,Read,Write,Grep,Glob --max-turns 60"

      - name: Verify the tree is green (authoritative merge gate)
        id: verify
        run: |
          set -e
          echo "::group::backend pytest"
          cd backend && (uv sync --frozen || uv sync) && uv run pytest && cd ..
          echo "::endgroup::"
          if [ "${{ steps.meta.outputs.directory }}" = "/frontend" ]; then
            echo "::group::frontend lint"
            cd frontend && npm ci && npm run lint && cd ..
            echo "::endgroup::"
          fi

      - name: Mark patch/minor ready to merge, hold majors for review
        if: ${{ steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "Patch/minor + green tests -> marking ready. NOT merging; see below."
              # This step deliberately does NOT merge, and that is the whole
              # point. Every merge performed with GITHUB_TOKEN lands as
              # github-actions[bot], and GitHub does not start workflow runs
              # for GITHUB_TOKEN pushes (loop prevention) -- so a bot merge
              # silently skips publish-package.yml and strands the GHCR image.
              # That is exactly how the image sat at ccd8f84 for 22 days while
              # develop moved on through #123, #124, #130 and #126.
              #
              # The previous body here read:
              #   gh pr merge --auto --squash ... || gh pr merge --squash ...
              # which was worse than it looked. While repo-wide auto-merge was
              # enabled the first command armed auto-merge and the fallback
              # never ran. The moment auto-merge was turned off, `--auto`
              # started failing and the `||` fallback merged outright, with no
              # approval and no publish.
              #
              # Leave it green and labelled instead. A merge by a real user is
              # a real push, which does trigger the publish.
              gh label create ready-to-merge --color 0E8A16 \
                --description "Tests green; merge by a human to publish" 2>/dev/null || true
              gh pr edit "$PR_URL" --add-label ready-to-merge || true
              # Keep each --body on ONE line. A backslash continuation whose
              # next line starts at column 0 ends the YAML block scalar and
              # makes the whole workflow file invalid.
              gh pr comment "$PR_URL" --body ":white_check_mark: **Patch/minor update, tests green — ready to merge.** Not merged automatically: a merge performed by GITHUB_TOKEN lands as github-actions[bot], and GitHub suppresses workflow runs for GITHUB_TOKEN pushes, so \`publish-package.yml\` would never fire and the GHCR image would go stale. Merge it yourself and the image publishes."
              ;;
            *)
              echo "Major (or unknown) update -> hold for a human."
              gh label create needs-review --color FBCA04 \
                --description "Held for human review" 2>/dev/null || true
              gh pr edit "$PR_URL" --add-label needs-review || true
              gh pr comment "$PR_URL" --body ":warning: **Major-version bump — held for review.** Tests pass, but per policy majors are not auto-merged. Merge manually to deploy."
              ;;
          esac

      - name: Comment when the update cannot be made green
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body ":x: **Tests still fail after Claude's review — not merging.** See the workflow run logs; a human will need to resolve this update."
