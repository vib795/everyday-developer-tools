name: Publish Docker image to GitHub Packages

on:
  push:
    branches:
      # "master" has never existed in this repo; the default branch is develop.
      - develop
  # Required, not a convenience. GitHub does not start workflow runs for pushes
  # made with GITHUB_TOKEN, and auto-merge merges as github-actions[bot] -- so
  # every auto-merged PR lands on develop WITHOUT publishing an image, silently.
  # #123 (e4495c0) and #124 (bee9a40) both did exactly that, leaving the
  # published image stranded at ccd8f84, the last commit merged by a real user.
  # This lets the image be published for a commit that arrived that way:
  #   gh workflow run publish-package.yml --ref develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          # Was ghcr.io/<owner>/utkarshsingh/developer-tools-dev, which wedged a
          # second account name into the path. The owner is already supplied by
          # github.repository_owner.
          tags: ghcr.io/${{ github.repository_owner }}/developer-tools-dev:latest
