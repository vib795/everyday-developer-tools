# Dependabot keeps dependencies patched and turns security advisories into PRs.
# The companion workflow .github/workflows/claude-dependabot.yml then has Claude
# review each PR, fix any breakage, and auto-merge safe (patch/minor) updates —
# which deploys, since Render auto-deploys every push to `develop`.
#
# Security advisories still open their own dedicated PR regardless of the grouping
# below, so each Dependabot alert maps to a reviewable, auto-mergeable PR.
version: 2
updates:
  # Python backend — uv resolves backend/uv.lock from backend/pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # React/Vite frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The workflow actions pinned under .github/workflows themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Base images in every Dockerfile, not just the root one Render builds from.
  # `/` alone left backend/Dockerfile and frontend/Dockerfile unwatched, which
  # is how the former sat on python:3.12-slim while production ran 3.14.
  # (frontend/Dockerfile's `nginx:alpine` carries no version to track, so it
  # stays Dependabot-invisible until it is pinned to a release line.)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
