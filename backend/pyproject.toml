[project]
name = "developer-tools-backend"
version = "1.0.0"
description = "FastAPI backend for the developer-tools web app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "redis>=8.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "pytz>=2026.3.post1",
    "jsonschema>=4.23",
    "genson>=1.4.0",
    "exrex>=0.11",
    "faker>=40.36.0",
    "pyjwt>=2.13.0",
    "markdown>=3.7",
    "reportlab>=5.0",
    "pypdf>=6.14.0",
    "pillow>=12.3",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
    "xmltodict>=0.14",
    "jsonpath-ng>=1.6",
    "croniter>=6.2.4",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
