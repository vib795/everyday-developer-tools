[project]
name = "developer-tools-backend"
version = "1.0.0"
description = "FastAPI backend for the developer-tools web app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "redis>=8.1.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "pytz>=2026.3.post1",
    "jsonschema>=4.23",
    "genson>=1.4.0",
    "exrex>=0.11",
    "faker>=40.36.0",
    "pyjwt>=2.13.0",
    "markdown>=3.10.3",
    "reportlab>=5.0",
    "pypdf>=6.15.0",
    "pillow>=12.3",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
    "xmltodict>=0.14",
    "jsonpath-ng>=1.6",
    "croniter>=6.2.4",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's implicit default grew from a small
# core (E4/E7/E9/F) to 400+ rules, which silently pulled in bugbear,
# bandit, DTZ, SIM, PIE and PL here -- flagging FastAPI's File() parameter
# default, the deliberate naive-then-localize parse in time_convert.py, and
# even demanding removal of the "# noqa: E741" comments that E741 needs.
# Selecting outright keeps lint results a property of this repo rather than
# of whichever ruff version happens to be installed.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
